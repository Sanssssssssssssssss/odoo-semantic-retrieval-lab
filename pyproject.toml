[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-semantic-retrieval-lab"
version = "0.1.0"
description = "Evidence-led Odoo documentation retrieval benchmark laboratory"
requires-python = ">=3.10,<3.11"
dependencies = [
  "beir>=2.1,<3",
  "bm25s>=0.2,<0.3",
  "docutils==0.17.0",
  "huggingface-hub>=0.34,<2",
  "ir-measures>=0.4,<0.5",
  "jsonschema>=4.23,<5",
  "nvidia-ml-py>=12,<14",
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "pygments~=2.6.1",
  "scipy>=1.12,<2",
  "sentence-transformers>=5,<6",
  "setuptools<81",
  "sphinx==4.3.2",
  "sphinx-tabs==3.4.5",
  "sphinxcontrib-applehelp==1.0.4",
  "sphinxcontrib-devhelp==1.0.2",
  "sphinxcontrib-htmlhelp==2.0.0",
  "sphinxcontrib-qthelp==1.0.3",
  "sphinxcontrib-serializinghtml==1.1.5",
  "torch>=2.7,<3",
  "transformers>=4.52,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/osrlab"]

[tool.uv]
override-dependencies = [
  "sphinxcontrib-applehelp==1.0.4",
  "sphinxcontrib-devhelp==1.0.2",
  "sphinxcontrib-htmlhelp==2.0.0",
  "sphinxcontrib-qthelp==1.0.3",
  "sphinxcontrib-serializinghtml==1.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest"
